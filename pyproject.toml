[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openedx-course-payments"
version = "0.1.0"
description = "Open edX side of Campus: paid-only enrollments and course pages on the public site"
readme = "README.md"
requires-python = ">=3.11"
# Django and edx libs are provided by edx-platform
dependencies = []

[project.entry-points."lms.djangoapp"]
course_payments = "course_payments.apps:CoursePaymentsConfig"

[tool.setuptools.packages.find]
include = ["course_payments*"]
